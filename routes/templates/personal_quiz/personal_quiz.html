{% extends "base.html" %}
{% block content %}

<style>
    #root-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 90vh;
    }
    #top-bar {
        display: flex;
        width: 100%;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding: .3% 0%;
        background: black;
    }
    #top-bar select, #top-bar button {
        background: none;
        border: 2px solid white;
        border-radius: 1.5rem;
        color: white;
        padding: 0% 1%;
        transition: all .15s ease;
        height: 32px;
        box-sizing: border-box;
        margin: 0;
    }
    #top-bar button:hover {
        transform: scale(.95);
    }
    #chapters option {
        background: black;
        color: white;
    }

    /* The switch - the box around the slider */
    .switch {
    position: relative;
    display: block;
    align-items: center;
    width: 52px;
    height: 27px;
    flex-shrink: 0;
    margin: 0;
    padding: 0;
    align-self: center;
    line-height: 0;
    }

    /* Hide default HTML checkbox */
    .switch input {
    opacity: 0;
    width: 0;
    height: 0;
    }

    /* The slider */
    .slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #000000;
    -webkit-transition: .4s;
    transition: .4s;
    border: 2px solid white;
    }

    .slider:before {
    position: absolute;
    content: "";
    height: 16px;
    width: 16px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    -webkit-transition: .4s;
    transition: .4s;
    }

    input:checked + .slider {
    background-color: #149842;
    }

    input:focus + .slider {
    box-shadow: 0 0 1px #2196F3;
    }

    input:checked + .slider:before {
    -webkit-transform: translateX(26px);
    -ms-transform: translateX(26px);
    transform: translateX(26px);
    }

    /* Rounded sliders */
    .slider.round {
    border-radius: 34px;
    }

    .slider.round:before {
    border-radius: 50%;
    }

    /* ----------------------------------------Popup--------------------------------- */
    #overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 999;
    }
    .popup {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px;
        border: 1px solid black;
        box-shadow: 0 0 10px gray;
        z-index: 9999;
        border-radius: .5rem;
    }
    .popup-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }
    .popup-content p {
        font-size: .9rem;
    }
    .popup-content input {
        width: 100%;
        margin: 5px 0;
        padding: 5px;
        border-radius: .5rem;
        border: 1px solid gray;
    }
    .close-popup-btn-container {
        display: flex;
        justify-content: flex-end;
        width: 100%;
    }
    .close-popup-btn {
        background: none;
        border: none;
        text-align: right;
        color: red;
    }
    .btn-style-1 {
        width: 100%;
        background: black;
        color: white;
        border: none;
        border-radius: .5rem;
        padding: 2% 0%;
        transition: all .15s ease;
    }
    .btn-style-1:hover {
        transform: scale(.95);
    }
    

    /* ------------------------------------- Quiz body---------------------------------------------------- */
    #quiz-body {
        width: 100%;
        min-height: 80vh;
        display: none;
        flex-direction: column;
        align-items: center;
    }
    #quiz-body-header {
        display: flex;
        justify-content: space-between;
        width: 90%;
        padding-top: 1%;
        border-bottom: 2px solid black;
        margin: 0%;
    }
    #quiz-body-button-container {
        display: flex;
        justify-content: center;
        width: 90%;
        padding-top: 1%;
        border-top: 2px solid black;
        margin: 0%;
        gap: 10px;
    }
    .quiz-body-btn {
        background: black;
        border: none;
        border-radius: 1.5rem;
        color: white;
        padding: 0% 1%;
        transition: all .15s ease;
        height: 32px;
        box-sizing: border-box;
        margin: 0;
    }
    .quiz-body-btn:hover {
        transform: scale(.95);
    }
    #chapter-header {
        font-weight: 700;
        font-size: 2rem;
        background: black;
        color: white;
        width: 100%;
        text-align: center;
        border-top: 1px solid white;
        margin: 0%;
    }
    #quiz-body-header p {
        margin: 0%;
        padding: 0%;
        font-family: Arial, sans-serif;
        font-weight: 900;
        font-size: 1.2rem;
    }
    #question-answer-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 90%;
        margin: 2% 0%;
        min-height: 20vh;
    }
    #question-container {
        font-family: Arial, sans-serif;
        font-weight: 700;
        font-size: 2rem;
    }
    #answer {
        display: none;
        font-family: Arial, sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        color: green;
    }
    /* ---------------------------- RESPONSIVE ----------------------------------------------------- */
    @media (max-width: 600px) {
        #top-bar {
            flex-direction: column;
            gap: 5px;
        }
        #top-bar button {
            padding: 0% 4%;
        }
        #quiz-body-header {
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        #quiz-body-button-container button {
            padding: 0% 4%;
        }
        #question-container {
            font-family: Arial, sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
        }
        #answer {
            font-family: Arial, sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 2%;
        }
        #quiz-body-header p{
            font-family: Arial, sans-serif;
            font-weight: 900;
            font-size: 1rem;
        }
        #add-chapter-popup {
            width: 90%;
        }
    }
</style>

<div id="root-container">
    <div id="top-bar">
        <button id="add-quiz-chapter" onclick="openAddQuizChapterPopup()">Add</button>
        <select id="chapters" oninput="loadQuizChapter(this.value)">
            <option value="">Chapters</option>
            {% for chapter in chapter_tuple_list %}
                <option value="{{ chapter[0] }}">{{ chapter[1] }}</option>
            {% endfor %}
        </select>
        <label class="switch">
            <input id="reverse-toggle" type="checkbox" onchange="reverseToggle(this.checked)">
            <span class="slider round"></span>
        </label>
        <div style="color: white;">Reverse</div>

    </div>
    <div id="quiz-body">
        <p id="chapter-header"></p>
        <div id="quiz-body-header">
            <p>Questions: <span id="current-serial"></span>/<span id="total-questions"></span></p>
            <p>Score: <span id="current-score"></span>/<span id="total-questions2"></span></p>
            <p>Top Score: <span id="top-score"></span>%</p>
        </div>
        <div id="question-answer-container">
            <p id="question-container"><span id="serial"></span><span id="question"></span></p>
            <p id="answer"></p>
        </div>
        
        <div id="quiz-body-button-container">
            <button class="quiz-body-btn" onclick="markWrong()">Wrong</button>
            <button class="quiz-body-btn" onclick="showAnswer()">Answer</button>
            <button class="quiz-body-btn" onclick="nextQuestion()">Next</button>
            <button class="quiz-body-btn" onclick="finishQuiz()">Finish</button>
        </div>

    </div>
</div>
<div id="overlay" onclick="closePopup()"></div>
<div id="add-chapter-popup" class="popup">
    <div class="popup-content" id="add-chapter-popup-content">
        <div class="close-popup-btn-container">
            <button class="close-popup-btn" onclick="closePopup()">x</button>
        </div>
        <p style="font-weight: 700;">ADD CHAPTER</p>
        <input type="file" id="chapter-file" accept=".txt">
        <input type="text" id="chapter-name" placeholder="Chapter Name">
        <input type="text" id="chapter-category" placeholder="Chapter Category">
        <input type="text" id="chapter-subject" placeholder="Chapter Subject">
        <button class="btn-style-1" onclick="saveQuizChapter()">Save</button>
    </div>
</div>

<script>
    function closePopup() {
        document.getElementById("overlay").style.display = "none";
        document.getElementById('add-chapter-popup').style.display = 'none';
    }

    function openAddQuizChapterPopup() {
        document.getElementById("overlay").style.display = "block";
        document.getElementById('add-chapter-popup').style.display = 'block';
    }

    function saveQuizChapter() {
        const endpointUrl = "{{ url_for('personal_quiz.add_chapter') }}";
        const fileInput = document.getElementById('chapter-file');
        const chapterName = document.getElementById('chapter-name').value;
        const chapterCategory = document.getElementById('chapter-category').value;
        const chapterSubject = document.getElementById('chapter-subject').value;

        if (!fileInput.files.length || !chapterName) {
            alert("Please fill in chapter name and select a file.");
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('name', chapterName);
        formData.append('category', chapterCategory);
        formData.append('subject', chapterSubject);

        fetch(endpointUrl, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert("Chapter added successfully!");
                closePopup();
                // Optionally, refresh the chapters dropdown or the page
                location.reload();
            } else {
                alert("Error adding chapter: " + data.error);
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("An error occurred while adding the chapter.");
        });
    }

    

    let totalQuestions = 0;
    let currentSerial = 0;
    let currentScore = 0;
    let topScore = 0;
    let questionAnswerList;
    let currentChapterId;
    let currentTopScore;
    let questionIndex;
    let reverseMode = false;

    function reverseToggle(isChecked) {
        if (isChecked) {
            reverseMode = true;
        } else {
            reverseMode = false;
        }
    }

    function resetQuiz() {
        totalQuestions = 0;
        currentSerial = 0;
        currentScore = 0;
        topScore = 0;
        questionAnswerList = [];
        currentChapterId = null;
        currentTopScore = 0;
        questionIndex = 0;
    }

    function getRandomIntInclusive(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    
    function loadQuizChapter(chapterId) {
        if (!chapterId) {
            document.getElementById('quiz-body').innerHTML = '';
            return;
        }
        currentChapterId = chapterId;
        const endpointUrl = "{{ url_for('personal_quiz.load_chapter') }}";
        fetch(endpointUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ chapter_id: chapterId })
        }   )
        .then(response => response.json())
            .then(data => {
                if (data.success) {
                    resetQuiz();
                    // Handle the loaded chapter data
                    // Update the quiz body with the loaded chapter data
                    const header = document.getElementById('chapter-header');
                    const currentSerialText = document.getElementById('current-serial');
                    const totalQuestionsText = document.getElementById('total-questions');
                    const totalQuestions2Text = document.getElementById('total-questions2');
                    const currentScoreText = document.getElementById('current-score');
                    const topScoreText = document.getElementById('top-score');
                    const questionText = document.getElementById('question');
                    const answerText = document.getElementById('answer');

                    if (data.top_score === null) {
                        topScore = 0;
                    } else {
                        topScore = data.top_score;
                    }

                    header.innerHTML = data.chapter_name
                    currentSerial += 1;
                    currentSerialText.innerHTML = currentSerial;
                    totalQuestions = data.q_a_list.length;
                    totalQuestionsText.innerHTML = totalQuestions;
                    totalQuestions2Text.innerHTML = totalQuestions;
                    questionAnswerList = data.q_a_list;
                    currentScoreText.innerHTML = currentScore;
                    topScoreText.innerHTML = topScore;
                    questionIndex = getRandomIntInclusive(0, questionAnswerList.length - 1);
                    if (reverseMode) {
                        // Swap question and answer if reverse mode is enabled
                        questionText.innerHTML = questionAnswerList[questionIndex]['answer'];
                        answerText.innerHTML = questionAnswerList[questionIndex]['question'];
                    } else {
                        questionText.innerHTML = questionAnswerList[questionIndex]['question'];
                        answerText.innerHTML = questionAnswerList[questionIndex]['answer'];
                    }
                    document.getElementById('quiz-body').style.display = 'flex';
                } else {
                    alert("Error loading chapter: " + data.error);
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("An error occurred while loading the chapter.");
            });
    }

    function markWrong() {
        currentSerial += 1;
        questionIndex = getRandomIntInclusive(0, questionAnswerList.length - 1);
        if (questionAnswerList.length === 0) {
            finishQuiz();
            return;
        }
        const questionText = document.getElementById('question');
        const answerText = document.getElementById('answer');
        const currentSerialText = document.getElementById('current-serial');
        if (reverseMode) {
            // Swap question and answer if reverse mode is enabled
            questionText.innerHTML = questionAnswerList[questionIndex]['answer'];
            answerText.innerHTML = questionAnswerList[questionIndex]['question'];
        } else {
            questionText.innerHTML = questionAnswerList[questionIndex]['question'];
            answerText.innerHTML = questionAnswerList[questionIndex]['answer'];
        }
        currentSerialText.innerHTML = currentSerial;
        document.getElementById('answer').style.display = 'none';
    }
    function showAnswer() {
        document.getElementById('answer').style.display = 'block';
    }

    function nextQuestion() {
        currentScore += 1;
        currentSerial += 1;
        questionAnswerList.splice(questionIndex, 1);

        document.getElementById('current-score').innerHTML = currentScore;
        if (questionAnswerList.length === 0) {
            finishQuiz();
            return;
        }
        const questionText = document.getElementById('question');
        const answerText = document.getElementById('answer');
        const currentSerialText = document.getElementById('current-serial');
        questionIndex = getRandomIntInclusive(0, questionAnswerList.length - 1);
        if (reverseMode) {
            // Swap question and answer if reverse mode is enabled
            questionText.innerHTML = questionAnswerList[questionIndex]['answer'];
            answerText.innerHTML = questionAnswerList[questionIndex]['question'];
        } else {
            questionText.innerHTML = questionAnswerList[questionIndex]['question'];
            answerText.innerHTML = questionAnswerList[questionIndex]['answer'];
        }
        currentSerialText.innerHTML = currentSerial;
        document.getElementById('answer').style.display = 'none';
    }

    function finishQuiz() {
        currentTopScore = Math.round((currentScore/currentSerial) * 100)
        alert("Quiz finished! Your score: " + currentTopScore + "%. Top score: " + topScore);
        // Optionally, you can reset the quiz or redirect to another page
        
        if (currentTopScore > topScore) {
            fetch("{{ url_for('personal_quiz.update_top_score') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 'chapter_id': currentChapterId, 'new_score': currentTopScore })
            })
            .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        alert("Error updating top score: " + data.error);
                    }
                    window.location.reload();

                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("An error occurred while updating the top score.");
                });
        } else {
            window.location.reload();
        }
    }
</script>


{% endblock %}
