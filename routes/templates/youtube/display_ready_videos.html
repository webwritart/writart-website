{% extends "base.html" %}
{% block content %}

<style>
    #root-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0% 5% 5% 5%;
        width: 100%;
        min-height: 85vh;
        background: rgb(103, 106, 87);
    }
    #video-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }
    .section-title {
        font-size: 1.5rem;
        font-weight: 600;
    }
    .figure-container {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        width: 100%;
    }
    .figure {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 1%;
        height: 25vh;
        background: white;
        padding: .5%;
        border-radius: .3rem;
    }
    .responsive-iframe {
        width: 100%;
        height: 80%;
        border-radius: .3rem;
    }
    .project-view-btn {
        font-size: .9rem;
        border: none;
        background: rgb(72, 81, 55);
        color: white;
        border-radius: .3rem;
        padding: .5% 0% .5% 0%;
        width: 100%;
        transition: all 0.15s ease-in-out;
    }
    .project-view-btn:hover {
        background: rgb(49, 56, 38);
    }
</style>

<div id="root-container">
    <div id="video-container">
        <p class="section-title">Ready Videos</p>
        <div class="figure-container">
            {% for v in all_video_ready_projects %}
            <figure class="figure">
                <iframe class="responsive-iframe" src="https://www.youtube.com/embed/{{ v[2] }}?si=2BVYS-0QHsxcX4f5&;"
                title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write;
                encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen></iframe>
                <figcaption style="color: rgb(0, 0, 0);">{{ v[1] }}</figcaption>
                <button class="project-view-btn" onclick="viewProject('{{ v[0] }}')">View</button>
            </figure>
            {% endfor %}
        </div>
    </div>
</div>

<script>
    function viewProject(uuid) {
        url = "{{ url_for('youtube.home') }}";
        window.location.href = url + '?project_uuid=' + uuid;
    }
</script>

{% endblock %}
